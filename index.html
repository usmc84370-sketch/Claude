<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<!--PAGE-->
<title>Meridian Empires</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: the map is the table. Instruments (stats, orders, city ledger) float over it at the edges. */
:root{
  --ink:#121a2b; --panel:#22304f; --panel2:#2e4169; --line:#4a639a;
  --fg:#f6f1e2; --dim:#aebbd4; --brass:#ffc53d; --good:#86cc7c; --bad:#e56f62; --sci:#6fbcec; --cul:#cc92e6;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif; --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font:14px/1.35 var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--brass)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
button:disabled{opacity:.4;cursor:default;border-color:var(--line)}
button.primary{background:var(--brass);color:#1c1608;border-color:var(--brass);font-weight:600}
button.warn{border-color:var(--bad);color:var(--bad)}
#app{height:100%;display:flex;flex-direction:column}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:18px var(--display);letter-spacing:.04em;color:var(--brass)}
#stats{display:flex;flex-wrap:wrap;gap:4px 14px;flex:1;min-width:0;font-variant-numeric:tabular-nums}
#stats b{font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
#bar nav{display:flex;gap:6px;flex-wrap:wrap}
#bar nav button{padding:4px 9px}
#bTech.need,#bPol.need,#bRel.need{border-color:var(--brass);color:var(--brass)}
#stage{flex:1;position:relative;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#toasts{position:absolute;top:8px;left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:min(360px,70%)}
.toast{background:rgba(24,34,44,.92);border-left:3px solid var(--brass);padding:4px 9px;border-radius:2px;font-size:13px}
.toast.bad{border-color:var(--bad)} .toast.good{border-color:var(--good)}
#tip{position:absolute;top:8px;right:max(16px,env(safe-area-inset-right,0px));background:rgba(24,34,44,.9);padding:4px 9px;border-radius:2px;font-size:12px;color:var(--dim);pointer-events:none;max-width:260px}
#view{position:absolute;top:8px;right:max(16px,env(safe-area-inset-right,0px));z-index:4;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--brass);padding:9px 11px;display:flex;flex-direction:column;gap:6px;min-width:200px}
#view label{display:flex;gap:8px;align-items:center;cursor:pointer}
#view small{color:var(--dim)}
#view input{accent-color:var(--brass);width:16px;height:16px;margin:0}
#dock{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;pointer-events:none;
  padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#dock>*{pointer-events:auto}
#left{display:flex;flex-direction:column;gap:8px;min-width:0;max-width:430px}
#info .pv{margin:0;line-height:1.45}
#view select{width:auto;padding:3px 5px;margin-left:auto}
#unit,#info{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--brass);padding:9px 11px;min-width:0;max-width:430px}
#unit h3,#info h3{margin:0;font:16px var(--display);letter-spacing:.03em}
#unit .meta,#info .meta{color:var(--dim);font-size:12.5px;margin:2px 0 7px}
.pv{background:var(--panel2);border-left:3px solid var(--bad);padding:4px 8px;margin-bottom:7px;font-size:13px}
.card{border:1px solid var(--line);border-radius:4px;padding:9px 10px;margin-top:8px}
.acts{display:flex;flex-wrap:wrap;gap:5px}
#right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:auto}
#mini{border:1px solid var(--line);background:#0a0f14;cursor:pointer;max-width:100%}
#turnbox{display:flex;gap:6px}
#bEnd{padding:10px 18px;font:16px var(--display);letter-spacing:.05em}
#city{position:absolute;top:0;right:0;bottom:0;width:min(350px,100%);background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;z-index:3;
  padding:12px;padding-right:max(12px,env(safe-area-inset-right,0px))}
#city h2{margin:0;font:21px var(--display);letter-spacing:.03em}
#city h4,.sheet h4{margin:13px 0 5px;font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.yl{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px;text-align:center;font-variant-numeric:tabular-nums}
.yl div{background:var(--panel2);padding:4px 0;border-radius:3px}
.yl small{display:block;color:var(--dim);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.meter{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--brass)}
.opt{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;margin-bottom:4px;background:transparent}
.opt small{display:block;color:var(--dim);font-size:11.5px}
.opt.cur{border-color:var(--brass);background:var(--panel2)}
.opt .c{white-space:nowrap;color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
.seg{display:flex;gap:4px}.seg button{flex:1;padding:4px}.seg .on{border-color:var(--brass);color:var(--brass)}
#modal{position:absolute;inset:0;background:rgba(6,10,14,.72);z-index:5;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--brass);max-width:860px;width:100%;max-height:100%;overflow-y:auto;padding:16px 18px}
.sheet h2{margin:0 0 4px;font:23px var(--display);letter-spacing:.03em;text-wrap:balance}
.sheet p{color:var(--dim);margin:6px 0;max-width:65ch}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.tech{text-align:left;background:transparent;display:block;width:100%}
.tech small{display:block;color:var(--dim);font-size:11.5px}
.tech.done{opacity:.5;border-style:dashed}.tech.cur{border-color:var(--brass);background:var(--panel2)}
.tech.av{border-color:var(--sci)}
table{border-collapse:collapse;width:100%}td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
label.f{display:block;margin:10px 0 3px;color:var(--dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
select{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px;width:100%}
.tw{overflow-x:auto}
@media (max-width:640px){
  .brand{font-size:15px}#mini{display:none}
  #dock{flex-direction:column-reverse;align-items:stretch}#right{align-items:flex-end}#left,#unit,#info{max-width:none}
  #city{top:auto;height:62%;width:100%;border-left:0;border-top:2px solid var(--brass)}
  #tip{display:none}
}
@media (max-height:520px){
  body{font-size:13px}
  #bar{padding-block:3px;gap:2px 10px;flex-wrap:nowrap}
  .brand,.xl,#mini,#tip{display:none}
  #stats{font-size:12px;gap:0 10px}
  #bar nav{flex-wrap:nowrap;gap:4px}
  #bar nav button{padding:3px 7px;font-size:12px}
  #left{max-width:min(360px,48%)}
  #unit,#info{padding:6px 9px}
  #unit h3,#info h3{font-size:14px}
  #unit .row button,#info .row button{padding:2px 8px}
  #unit .meta,#info .meta{margin:1px 0 5px;font-size:12px}
  #info .pv,.pv{font-size:12px;margin-bottom:5px}
  .acts button{padding:4px 8px}
  #dock{padding-bottom:6px;gap:8px}
  #bEnd{padding:7px 14px;font-size:14px}
  #bSub{padding:5px 9px}
  #city{width:min(310px,100%);padding:8px 10px}
  #city h2{font-size:17px}
  #city h4,.sheet h4{margin:9px 0 4px}
  #modal{padding:6px}
  .sheet{padding:10px 14px}
  .sheet h2{font-size:18px}
  #view{top:4px;padding:6px 9px;gap:3px;max-height:calc(100% - 8px);overflow-y:auto}
  .toast{font-size:12px;padding:3px 8px}
  #toasts{max-width:42%}
}
.pv.promo{border-color:var(--brass)}.pv.promo .acts{margin-top:5px}.pv.promo small{color:var(--dim)}
button{border-radius:10px;border-width:2px;font-weight:600;box-shadow:0 2px 0 rgba(0,0,0,.35)}
button.primary{box-shadow:0 3px 0 #b07d10;color:#3a2500}
#unit,#info,#view,.sheet,.card,.toast,#tip,#mini{border-radius:12px}
#unit,#info,#view,.sheet{border:2px solid var(--line);border-top:3px solid var(--brass)}
#city{border-left:2px solid var(--line)}
.yl div,.meter,.pv,select{border-radius:8px}
.brand{font-weight:600;letter-spacing:.01em}
#unit h3,#info h3,#city h2,.sheet h2,#bEnd{letter-spacing:.01em;font-weight:600}
#app{position:relative}
#start{position:absolute;inset:0;z-index:10;display:flex;align-items:flex-start;overflow-y:auto;background:radial-gradient(ellipse at 50% 30%,rgba(18,26,43,.7),rgba(9,13,24,.95));padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{text-align:center;max-width:560px;margin:auto}
.kick{color:var(--brass);font:600 13px var(--display);letter-spacing:.14em;text-transform:uppercase}
.hero h1{font:700 clamp(38px,9vw,72px)/1 var(--display);margin:8px 0 12px;color:#fff;text-shadow:0 4px 0 #2b1c10,0 0 30px rgba(255,197,61,.35);text-wrap:balance}
.hero p{color:var(--fg);margin:0 auto 22px;max-width:44ch;font-size:16px}
.sbtn{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto}
button.big{padding:12px 18px;font:600 18px var(--display)}
button.big small{display:block;font:500 12.5px var(--body);opacity:.8}
.panel{background:var(--panel);border:2px solid var(--line);border-top:3px solid var(--brass);border-radius:14px;padding:16px 18px;max-width:880px;width:100%;margin:auto;min-width:0}
.panel h2{margin:0 0 4px;font:600 24px var(--display)}
.panel p{color:var(--dim);margin:6px 0;max-width:70ch}
.panel h4{margin:12px 0 6px;font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.panel .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.nats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.nat{text-align:left;background:transparent;display:block;border-left:7px solid var(--nc)}
.nat.on{background:var(--panel2);border-color:var(--brass);border-left-color:var(--nc)}
.nat em{display:block;font-style:normal;color:var(--brass);font-size:12.5px;margin:1px 0 2px}
.nat small{display:block;color:var(--dim);font-weight:500;font-size:12px}
.srow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 12px}
@media (max-height:520px){
  #start{padding-block:8px}
  .hero h1{font-size:34px;margin:4px 0 6px}.hero p{margin-bottom:10px;font-size:14px}
  .sbtn{flex-direction:row;max-width:none;justify-content:center;flex-wrap:wrap}
  button.big{padding:7px 14px;font-size:15px}
  .panel{padding:10px 14px}.panel h2{font-size:18px}
  .nats{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
}
#unit{max-height:min(54vh,430px);overflow-y:auto}
@media (max-width:640px){
  .brand,.xl{display:none}
  #bar{padding-block:4px;gap:3px 8px}
  #stats{flex-basis:100%;font-size:12.5px;gap:1px 10px}
  #bar nav{flex-basis:100%;flex-wrap:nowrap;gap:4px;justify-content:space-between}
  #bar nav button{padding:4px 1px;font-size:11.5px;flex:1 1 auto;min-width:0}
  .toast{font-size:12px;padding:3px 8px}
  .toast:nth-last-child(n+4){display:none}
  #toasts{max-width:80%}
}
</style>

<div id="app">
  <header id="bar">
    <div class="brand">Meridian Empires</div>
    <div id="stats"></div>
    <nav>
      <button id="bTech" data-act="tech">Research</button>
      <button id="bPol" data-act="policy">Policies</button>
      <button id="bRel" data-act="faith">Faith</button>
      <button data-act="diplo">Diplomacy</button>
      <button data-act="view">View</button>
      <button data-act="menu">Menu</button>
    </nav>
  </header>
  <main id="stage">
    <canvas id="map"></canvas>
    <div id="toasts"></div>
    <div id="tip" hidden></div>
    <div id="view" hidden></div>
    <aside id="city" hidden></aside>
    <div id="dock">
      <div id="left"><div id="info" hidden></div><div id="unit" hidden></div></div>
      <div id="right">
        <canvas id="mini"></canvas>
        <div id="turnbox"><button id="bSub" data-act="forceEnd" hidden>End turn</button><button id="bEnd" class="primary" data-act="end">End turn</button></div>
      </div>
    </div>
    <div id="modal" hidden><div class="sheet" id="mbody"></div></div>
  </main>
  <div id="start" hidden></div>
</div>

function bestImp(t,pl){if(t.city||TERR[t.t].water||TERR[t.t].block)return null;const ok=m=>!IMP[m].tech||pl.techs[IMP[m].tech];

{const P=new Map();let moved=0,pd=0,hov=-1;
