<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<!--PAGE-->
<title>Meridian Empires</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Marcellus+SC&display=swap">
<style>
/* Layout: the map is the table. Instruments (stats, orders, city ledger) float over it at the edges. */
:root{
  --ink:#0e141b; --panel:#18222c; --panel2:#213040; --line:#35475a;
  --fg:#e9e4d4; --dim:#9aa7b0; --brass:#d6a84c; --good:#86cc7c; --bad:#e56f62; --sci:#6fbcec; --cul:#cc92e6;
  --display:'Marcellus SC',Georgia,'Times New Roman',serif; --body:'Barlow','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font:14px/1.35 var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--brass)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
button:disabled{opacity:.4;cursor:default;border-color:var(--line)}
button.primary{background:var(--brass);color:#1c1608;border-color:var(--brass);font-weight:600}
button.warn{border-color:var(--bad);color:var(--bad)}
#app{height:100%;display:flex;flex-direction:column}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:18px var(--display);letter-spacing:.04em;color:var(--brass)}
#stats{display:flex;flex-wrap:wrap;gap:4px 14px;flex:1;min-width:0;font-variant-numeric:tabular-nums}
#stats b{font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
#bar nav{display:flex;gap:6px;flex-wrap:wrap}
#bar nav button{padding:4px 9px}
#bTech.need,#bPol.need,#bRel.need{border-color:var(--brass);color:var(--brass)}
#stage{flex:1;position:relative;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#toasts{position:absolute;top:8px;left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:min(360px,70%)}
.toast{background:rgba(24,34,44,.92);border-left:3px solid var(--brass);padding:4px 9px;border-radius:2px;font-size:13px}
.toast.bad{border-color:var(--bad)} .toast.good{border-color:var(--good)}
#tip{position:absolute;top:8px;right:max(16px,env(safe-area-inset-right,0px));background:rgba(24,34,44,.9);padding:4px 9px;border-radius:2px;font-size:12px;color:var(--dim);pointer-events:none;max-width:260px}
#view{position:absolute;top:8px;right:max(16px,env(safe-area-inset-right,0px));z-index:4;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--brass);padding:9px 11px;display:flex;flex-direction:column;gap:6px;min-width:200px}
#view label{display:flex;gap:8px;align-items:center;cursor:pointer}
#view small{color:var(--dim)}
#view input{accent-color:var(--brass);width:16px;height:16px;margin:0}
#dock{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;pointer-events:none;
  padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#dock>*{pointer-events:auto}
#unit{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--brass);padding:9px 11px;min-width:0;max-width:430px}
#unit h3{margin:0;font:16px var(--display);letter-spacing:.03em}
#unit .meta{color:var(--dim);font-size:12.5px;margin:2px 0 7px}
.pv{background:var(--panel2);border-left:3px solid var(--bad);padding:4px 8px;margin-bottom:7px;font-size:13px}
.card{border:1px solid var(--line);border-radius:4px;padding:9px 10px;margin-top:8px}
.acts{display:flex;flex-wrap:wrap;gap:5px}
#right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:auto}
#mini{border:1px solid var(--line);background:#0a0f14;cursor:pointer;max-width:100%}
#turnbox{display:flex;gap:6px}
#bEnd{padding:10px 18px;font:16px var(--display);letter-spacing:.05em}
#city{position:absolute;top:0;right:0;bottom:0;width:min(350px,100%);background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;z-index:3;
  padding:12px;padding-right:max(12px,env(safe-area-inset-right,0px))}
#city h2{margin:0;font:21px var(--display);letter-spacing:.03em}
#city h4,.sheet h4{margin:13px 0 5px;font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.yl{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px;text-align:center;font-variant-numeric:tabular-nums}
.yl div{background:var(--panel2);padding:4px 0;border-radius:3px}
.yl small{display:block;color:var(--dim);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.meter{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--brass)}
.opt{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;margin-bottom:4px;background:transparent}
.opt small{display:block;color:var(--dim);font-size:11.5px}
.opt.cur{border-color:var(--brass);background:var(--panel2)}
.opt .c{white-space:nowrap;color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
.seg{display:flex;gap:4px}.seg button{flex:1;padding:4px}.seg .on{border-color:var(--brass);color:var(--brass)}
#modal{position:absolute;inset:0;background:rgba(6,10,14,.72);z-index:5;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--brass);max-width:860px;width:100%;max-height:100%;overflow-y:auto;padding:16px 18px}
.sheet h2{margin:0 0 4px;font:23px var(--display);letter-spacing:.03em;text-wrap:balance}
.sheet p{color:var(--dim);margin:6px 0;max-width:65ch}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.tech{text-align:left;background:transparent;display:block;width:100%}
.tech small{display:block;color:var(--dim);font-size:11.5px}
.tech.done{opacity:.5;border-style:dashed}.tech.cur{border-color:var(--brass);background:var(--panel2)}
.tech.av{border-color:var(--sci)}
table{border-collapse:collapse;width:100%}td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
label.f{display:block;margin:10px 0 3px;color:var(--dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
select{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px;width:100%}
.tw{overflow-x:auto}
@media (max-width:640px){
  .brand{font-size:15px}#mini{display:none}
  #dock{flex-direction:column-reverse;align-items:stretch}#right{align-items:flex-end}#unit{max-width:none}
  #city{top:auto;height:62%;width:100%;border-left:0;border-top:2px solid var(--brass)}
  #tip{display:none}
}
</style>

<div id="app">
  <header id="bar">
    <div class="brand">Meridian Empires</div>
    <div id="stats"></div>
    <nav>
      <button id="bTech" data-act="tech">Research</button>
      <button id="bPol" data-act="policy">Policies</button>
      <button id="bRel" data-act="faith">Faith</button>
      <button data-act="diplo">Diplomacy</button>
      <button data-act="view">View</button>
      <button data-act="menu">Menu</button>
    </nav>
  </header>
  <main id="stage">
    <canvas id="map"></canvas>
    <div id="toasts"></div>
    <div id="tip" hidden></div>
    <div id="view" hidden></div>
    <aside id="city" hidden></aside>
    <div id="dock">
      <div id="unit" hidden></div>
      <div id="right">
        <canvas id="mini"></canvas>
        <div id="turnbox"><button id="bSub" data-act="forceEnd" hidden>End turn</button><button id="bEnd" class="primary" data-act="end">End turn</button></div>

    <div id="modal" hidden><div class="sheet" id="mbody"></div></div>
  </main>
</div>

  <div class="foot"><button data-act="close">Cancel</button><button class="primary" data-act="start">Start</button></div>`)},
 start(){const o={nation:+$('#sNat').value,size:+$('#sSize').value,ai:+$('#sAi').value,diff:+$('#sDiff').value};$('#modal').hidden=true;asks=[];askFns=[];$('#toasts').innerHTML='';newGame(o);save();ui()},
 cont(){G.cont=true;closeModal();ui()},close(){closeModal()},
 ask(i){const fn=askFns[+i];askFns=[];$('#modal').hidden=true;fn&&fn();nextAsk();ui()},
 closeCity(){cityOpen=null;ui()},
 build(a){const c=CM.get(cityOpen),[k,id]=a.split(':');if(!c)return;c.build={k,id};ui()},
 buy(){const c=CM.get(cityOpen),h=human();if(!c||!c.build)return;const bc=buyCost(c);if(h.gold<bc)return;h.gold-=bc;c.prod=itemCost(h,c.build);if(!complete(c)){note('No free tile next to '+c.name+' for the new unit.','bad')}ui()},
 focus(k){const c=CM.get(cityOpen);if(c)c.focus=k;ui()},
 found(){const u=selUnit();if(u&&u.mv>0&&canFound(u)){foundCity(u);selectNext(false)}ui()},
 improve(){const u=selUnit();if(u&&workerAct(u))selectNext(true);ui()},
 road(){const u=selUnit();if(u&&workerRoad(u))selectNext(true);ui()},
 trade(){const u=selUnit(),c=u&&canTrade(u);if(c){establish(u,c);selectNext(true)}ui()},
 spread(){const u=selUnit(),c=u&&canSpread(u);if(c){spreadFaith(u,c);selectNext(true)}ui()},
 auto(){const u=selUnit();if(!u)return;u.auto=!u.auto;if(u.auto){u.goto=null;autoWorker(u);selectNext(true)}ui()},
 fort(){const u=selUnit();if(u){u.fort=true;u.goto=null;selectNext(true)}ui()},sleep(){const u=selUnit();if(u){u.sleep=true;selectNext(true)}ui()},
 skip(){const u=selUnit();if(u){u.skip=true;if(!selectNext(true))sel=null}ui()},
 upgrade(){const u=selUnit();if(u)doUpgrade(u);ui()},
 disband(){const u=selUnit();if(u&&u.own===0)ask(`<h2>Disband this ${UNITS[u.type].n}?</h2><p>The unit is removed for good.</p>`,[['Keep it',()=>{}],['Disband',()=>{kill(u);checkElim(0)},'warn']]);},
 view(){const v=$('#view');v.hidden=!v.hidden},
 desel(){sel=null;pv=null;ui()}};
const VOPT=[['yields','Tile yields (Y)'],['res','Resources (R)'],['imp','Improvements'],['feat','Terrain art'],['grid','Hex grid (G)'],['tint','Territory tint'],['pol','Political map'],['rel','Religion map'],['routes','Trade routes']];
function viewUI(){$('#view').innerHTML='<div class="row"><b>Map view</b><button data-act="view" aria-label="Close">✕</button></div>'+VOPT.map(([k,n])=>`<label for="v_${k}"><input type="checkbox" id="v_${k}" data-v="${k}" ${V[k]?'checked':''}> ${n}</label>`).join('')+'<small>Yields read food, production, gold.</small>'}
function setV(k,val){V[k]=val==null?!V[k]:val;try{localStorage.setItem('meridian-view',JSON.stringify(V))}catch(e){}viewUI();dirty=true}
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.v;if(k)setV(k,e.target.checked)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled&&G)ACT[b.dataset.act](b.dataset.arg);else if(e.target.id==='modal'&&!askFns.length)closeModal()});
function order(u,i){if(!findPath(u,i)){note('No route there. Closed borders, water or mountains block the way.')}else{u.goto=i;u.auto=false;follow(u);if(u.mv<=0||u.goto!=null)selectNext(false)}}
function tap(px,py,touch,force){const{i,wx,wy}=pickHex(px,py),lb=labels.find(l=>wx>=l.x&&wx<=l.x+l.w&&wy>=l.y&&wy<=l.y+l.h),now=performance.now();
 if(lb&&!force){const c=CM.get(lb.id);if(c.own===0){sel=null;pv=null;openCity(c.id)}else note(c.name+' · '+G.players[c.own].name+' · population '+c.pop+(c.rel!=null?' · '+G.rels[c.rel].name:''));ui();return}
 if(i<0||!human().seen[i]){sel=null;pv=null;ui();return}
 const dbl=touch&&lastTap&&lastTap.i===i&&now-lastTap.t<450?lastTap.u:null;
 let u=selUnit();if(dbl){const p=G.units.find(q=>q.id===dbl);if(p&&p.own===0&&idx(p.c,p.r)!==i){sel=p.id;u=p;force=true}}
 lastTap={i,t:now,u:u&&u.own===0?u.id:null};
 const mine=u&&u.own===0,city=cityAtI(i),e=vis[i]?enemyAt(i,0):null,own=[uAt.get(i),cAt.get(i)].filter(o=>o&&o.own===0);
 if(mine&&e&&canAttack(u,i)){if(!atWar(0,e.own))ask(`<h2>Declare war on the ${esc(G.players[e.own].name)}?</h2><p>Attacking breaks the peace and ends your deals with them.</p>`,[['Stand down',()=>{}],['Declare war',()=>declareWar(0,e.own),'warn']]);
  else if(touch&&!(pv&&pv.i===i)){pv=preview(u,i);note('Tap again to attack.')}else{pv=null;attack(u,i);if(!selUnit()||selUnit().mv<=0)selectNext(false)}ui();return}
 pv=null;
 if(own.length&&vis[i]&&!force){const k=own.findIndex(o=>u&&o.id===u.id);if(k>=0&&k===own.length-1&&city&&city.own===0){sel=null;openCity(city.id)}else{const n=own[(k+1)%own.length];sel=n.id;n.sleep=false;n.fort=false;cityOpen=null}ui();return}
 if(!mine&&city&&city.own===0){openCity(city.id);return}
 if(mine){if(idx(u.c,u.r)!==i)order(u,i);ui();return}
 const here=uAt.get(i)||cAt.get(i);if(here&&vis[i]){sel=here.id}else{sel=null;cityOpen=null}ui()}
/* pointer + keys */
{const P=new Map();let moved=0,pd=0,hov=-1;
 cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);if(P.size===1)moved=0;else pd=0});
 cv.addEventListener('pointermove',e=>{if(!G)return;const p=P.get(e.pointerId);
  if(!p){if(e.pointerType==='mouse'){const{i}=pickHex(e.clientX,e.clientY),tp=$('#tip');if(i===hov)return;hov=i;if(i>=0&&human().seen[i]){const t=G.tiles[i],y=tileYield(i,human()),o=ownerOf(i);
    tp.textContent=[TERR[t.t].n+(t.h?' hills':'')+(t.f?' forest':''),t.res?RES[t.res].n:'',t.imp?IMP[t.imp].n:'',t.road?'Road':'',`${y.f} food ${y.p} prod ${y.g} gold`,o>=0?G.players[o].name:''].filter(Boolean).join(' · ');tp.hidden=false}else tp.hidden=true;
    const u=selUnit(),np=u&&u.own===0&&i>=0&&vis[i]?preview(u,i):null;if((np&&np.txt)!==(pv&&pv.txt)){pv=np;ui()}}return}
  if(P.size===2){P.set(e.pointerId,[e.clientX,e.clientY]);const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)cam.z=Math.max(.35,Math.min(2,cam.z*d/pd));pd=d;moved=99;dirty=miniDirty=true;return}
  const dx=e.clientX-p[0],dy=e.clientY-p[1];moved+=Math.abs(dx)+Math.abs(dy);if(moved>8){cam.x-=dx/cam.z;cam.y-=dy/cam.z;dirty=miniDirty=true}P.set(e.pointerId,[e.clientX,e.clientY])});
 const up=e=>{if(!P.has(e.pointerId))return;P.delete(e.pointerId);if(e.type==='pointerup'&&moved<=8&&!P.size&&G)tap(e.clientX,e.clientY,e.pointerType!=='mouse',e.button===2)};
 cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
 cv.addEventListener('wheel',e=>{e.preventDefault();cam.z=Math.max(.35,Math.min(2,cam.z*(e.deltaY<0?1.12:.89)));dirty=miniDirty=true},{passive:false});
 cv.addEventListener('contextmenu',e=>e.preventDefault());
 mini.addEventListener('click',e=>{const b=mini.getBoundingClientRect(),s=mini.width/(G.W+.5)*(b.width/mini.width);cam.x=(e.clientX-b.left)/s*SQ*S0-SQ*S0/2;cam.y=(e.clientY-b.top)/(s*.87)*1.5*S0;dirty=miniDirty=true});
 addEventListener('keydown',e=>{if(!G||e.target.tagName==='SELECT')return;const k=e.key;if(!$('#modal').hidden){if(k==='Escape'&&!askFns.length)closeModal();return}
  const pan={ArrowLeft:[-80,0],ArrowRight:[80,0],ArrowUp:[0,-80],ArrowDown:[0,80],a:[-80,0],d:[80,0],w:[0,-80],s:[0,80]}[k];
  if(pan){cam.x+=pan[0]/cam.z;cam.y+=pan[1]/cam.z;dirty=miniDirty=true}else if(k==='Enter'){e.preventDefault();e.shiftKey?ACT.forceEnd():ACT.end()}else if(k===' '){e.preventDefault();ACT.skip()}
  else if(k==='f'){const u=selUnit();if(u&&u.own===0&&UNITS[u.type].str)ACT.fort()}else if(k==='n'){selectNext(true);ui()}else if(k==='y'||k==='g'||k==='r')setV({y:'yields',g:'grid',r:'res'}[k]);else if(k==='Escape'){sel=null;pv=null;cityOpen=null;ui()}});
 addEventListener('resize',()=>{dirty=miniDirty=true})}

/* ================= BOOT ================= */
function boot(data){if(!(data&&data.G&&load(data.G))&&!load())newGame({nation:0,size:1,ai:3,diff:1});
 const u=unitsOf(0).find(needsOrders);if(u&&!sel){sel=u.id}viewUI();ui();requestAnimationFrame(loop);if(G.over&&!G.cont)showOver()}
window.DBG={get G(){return G},auto(n){G.autoplay=true;for(let k=0;k<n&&!(G.over&&!G.cont);k++){const h=human();if(h.alive){startTurn(h);aiTurn(h)}endTurn()}G.autoplay=false;updateVis();ui()}};
try{window.claude?.hot?.snapshot(()=>({G:JSON.parse(ser())}))}catch(e){}
if(window.claude?.hot?.ready)window.claude.hot.ready(boot);else boot(window.claude?.hot?.data??{});
